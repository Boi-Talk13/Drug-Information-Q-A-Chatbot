# Run the whole app with:  docker compose up
# Then open http://localhost:3000
#
# The app runs with no API key using the built-in extractive answerer. To have
# Groq write the answers, put AI_API_KEY in a .env file next to this one
# (see .env.example); compose passes it through automatically.

services:
  medcite:
    build: .
    ports:
      # Open the app on port 3000. Inside the container the server still
      # listens on 8000 (see Dockerfile); this maps it to 3000 on your machine.
      - "3000:8000"
    environment:
      # Read from .env if present; harmless if unset.
      AI_API_KEY: ${AI_API_KEY:-}
      # The model every accuracy and token number in the README was measured with.
      AI_MODEL: ${AI_MODEL:-openai/gpt-oss-20b}
      # Per-user daily limit (see backend/config.py). .env is not copied into the
      # image, so settings the container needs are passed through here.
      DAILY_QUESTION_LIMIT: ${DAILY_QUESTION_LIMIT:-30}
      USAGE_TIMEZONE: ${USAGE_TIMEZONE:-Asia/Kolkata}
      PDF_FOLDER: /app/data/pdfs
      INDEX_FOLDER: /app/data/index
    volumes:
      # Keep PDFs and the built index on the host so they survive a restart
      # and you can drop new PDFs in without rebuilding the image.
      - ./data/pdfs:/app/data/pdfs
      - ./data/index:/app/data/index
    restart: unless-stopped

# Database note: the backend uses PostgreSQL when DATABASE_URL is set, and
# otherwise a zero-setup SQLite file at data/index/medcite_log.db
# (backend/api/db.py). This file sets no DATABASE_URL, so the container uses
# SQLite — kept on the host through the data/index volume above. To use
# Postgres, add a `db:` service and pass DATABASE_URL; the tables are the same.
